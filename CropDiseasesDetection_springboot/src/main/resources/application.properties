spring.application.name=Kcsj
mybatis.mapper-locations=classpath:mappers/*xml
mybatis.type-aliases-package=com.example.Kcsj.mybatis.entity
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.name=defaultDataSource
spring.datasource.url=jdbc:mysql://localhost:3306/yoloai?serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
server.port=9999
file.ip=localhost
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# ================== JWT ==================
security.jwt.secret=ReplaceThisWithAtLeast32BytesSecretKeyForJwt123
security.jwt.access-expire-seconds=900
security.jwt.refresh-expire-seconds=604800

# ================== Flask ==================
flask.base-url=http://127.0.0.1:5000

# ================== Actuator & Prometheus ==================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# ================== Async Task ==================
app.task.core-pool-size=4
app.task.max-pool-size=8
app.task.queue-capacity=200
app.task.keep-alive-seconds=60




